name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "viewer/**", "src/KeyLayout.swift", "scripts/decompose.py", ".github/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install numpy pillow
      - run: ./site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build
      - id: deploy
        uses: actions/deploy-pages@v4
